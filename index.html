    <script>
      // Apply saved language + theme before first paint (prevents layout/theme flash).
      try {
        var l = localStorage.getItem('language'), t = localStorage.getItem('theme');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        if (localStorage.getItem('motion') === 'off') document.documentElement.classList.add('reduce-motion');
      } catch (e) {}
    </script>
